[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    -p no:warnings
markers =
    smoke: Smoke tests
    regression: Regression tests
    epic1: Epic 1 - Room Management
    epic2: Epic 2 - User Management
    epic3: Epic 3 - Advanced Booking
    epic4: Epic 4 - Admin
    epic5: Epic 5 - Filtering
    epic6: Epic 6 - Notifications
    epic7: Epic 7 - Reporting

